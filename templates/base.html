<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="author" content="Mark Simkin">
<link rel="canonical" href="{{ url }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:site_name" content="univariate.org">
<meta property="og:image" content="https://univariate.org/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mark Simkin · univariate.org">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@Simk1n">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/static/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=3">
<link rel="preload" href="/static/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/site.css?v={{ version }}">
<script defer src="/static/js/site.js?v={{ version }}"></script>
{{ math_head }}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="site-head">
    <a class="wordmark" href="/"><span class="t">~</span><span class="s">/</span>univariate</a>
    <nav aria-label="Main">{{ nav }}</nav>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer><p>© {{ year }} Mark Simkin · univariate.org</p><a href="#">back to top ↑</a></footer>
</div>
{{ reload }}
{{ analytics }}
</body>
</html>
