<!doctype html>
<!-- Source of static/og.png, the link-preview image (1200x630). Regenerate with
     tools/og.sh after editing. Served from the repo root so the font path resolves. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { font-family: "Geist Mono", monospace; color: #f2f2f3; -webkit-font-smoothing: antialiased; position: relative; }
  .wm { position: absolute; left: 72px; top: 64px; font-size: 26px; font-weight: 500; }
  .wm .t { color: #85858d; font-weight: 400; } .wm .s { color: #7396ff; }
  .name { position: absolute; left: 72px; right: 72px; top: 218px; white-space: nowrap; font-weight: 300; font-size: 147px; line-height: .8; letter-spacing: 0; }
  .cursor { display: inline-block; width: .52em; height: .7em; margin-left: .06em; background: #3b6cff; }
  .ruler { position: absolute; left: 72px; right: 72px; top: 400px; height: 1px; background: #2a2a2e; }
  .ruler i { position: absolute; top: -5px; width: 11px; height: 11px; margin-left: -5px;
    background: linear-gradient(#55555c, #55555c) 5px 0 / 1px 100% no-repeat, linear-gradient(#55555c, #55555c) 0 5px / 100% 1px no-repeat; }
  .ruler i:nth-child(1) { left: 33.333%; } .ruler i:nth-child(2) { left: 66.667%; }
  .line { position: absolute; left: 72px; top: 440px; font-size: 26px; line-height: 1.55; color: #c4c4c9; letter-spacing: -.01em; }
</style></head>
<body>
  <div class="wm"><span class="t">~</span><span class="s">/</span>univariate</div>
  <div class="name">Mark Simkin<span class="cursor"></span></div>
  <div class="ruler"><i></i><i></i></div>
  <div class="line">Cryptography, algorithms,<br>and the math in between.</div>
</body></html>
